<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KClainaus - Lainauslomake</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #f4f7f6; }
        .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin: 10px 0; cursor: pointer; padding: 5px; border-bottom: 1px solid #eee; }
        input[type="text"], input[type="email"] { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { background: #27ae60; color: white; border: none; padding: 15px; width: 100%; font-size: 1.1em; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        button:hover { background: #219150; }
    </style>
</head>
<body>
    <h1>Lainauslomake</h1>
    
    <div class="section">
        <div class="input-group"><input type="text" id="isantaNimi" placeholder="Isännän nimi"></div>
        <div class="input-group"><input type="email" id="isantaEmail" placeholder="Isännän sähköposti"></div>
        <div class="input-group"><input type="text" id="vierasNimi" placeholder="Vieraan nimi"></div>
        <div class="input-group"><input type="email" id="vierasEmail" placeholder="Vieraan sähköposti"></div>
    </div>

    <div class="section">
        <h2>Isännän tarkistuslista (Turvallisuus ja lainmukaisuus)</h2>
        <label><input type="checkbox" class="isanta-check" value="Veneen tekninen kunto (moottori, ohjaus, runko) tarkistettu"> Veneen tekninen kunto (moottori, ohjaus, runko)</label>
        <label><input type="checkbox" class="isanta-check" value="Pelastusliivit (riittävä määrä, tarkastettu)"> Pelastusliivit (riittävä määrä, tarkastettu)</label>
        <label><input type="checkbox" class="isanta-check" value="Tyhjennysvälineet (äyskäri/pumppu) mukana"> Tyhjennysvälineet (äyskäri/pumppu)</label>
        <label><input type="checkbox" class="isanta-check" value="Ankkuri ja kiinnitysköydet kunnossa"> Ankkuri ja kiinnitysköydet</label>
        <label><input type="checkbox" class="isanta-check" value="Viestintävälineet toimintakunnossa"> Viestintävälineet toimintakunnossa</label>
        <label><input type="checkbox" class="isanta-check" value="Käyttöopastus ja turvallisuusohjeistus annettu"> Käyttöopastus ja turvallisuusohjeistus</label>
        <label><input type="checkbox" class="isanta-check" value="Sääolosuhteet arvioitu ja todettu turvallisiksi"> Sääolosuhteet arvioitu turvalliseksi</label>
    </div>

    <div class="section">
        <h2>Vieraan tarkistuslista (Vastuullisuus ja osaaminen)</h2>
        <label><input type="checkbox" class="vieras-check" value="Uimataito vakuutettu (200m)"> Vakuutan omaavani riittävän uimataidon (200m)</label>
        <label><input type="checkbox" class="vieras-check" value="Pelastusliivit puettu oikein"> Vakuutan käyttäväni pelastusliivejä koko matkan</label>
        <label><input type="checkbox" class="vieras-check" value="Reittisuunnitelma ja paluuaika ilmoitettu"> Reittisuunnitelma ja paluuaika ilmoitettu</label>
        <label><input type="checkbox" class="vieras-check" value="Puhelin ladattu ja vesitiiviissä suojassa"> Puhelin ladattu ja vesitiiviissä suojassa</label>
        <label><input type="checkbox" class="vieras-check" value="Päihteettömyys vakuutettu"> Vakuutan olevani täysin päihteettömässä tilassa</label>
        <label><input type="checkbox" class="vieras-check" value="Ympäristövastuu (roskaton veneily) ymmärretty"> Sitoudun roskaamattomaan veneilyyn</label>
    </div>

    <button id="lahetaBtn">Lähetä ja tallenna</button>

    <script src="app.js"></script>
</body>
</html>
