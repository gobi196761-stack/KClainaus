<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KClainaus - Lainauslomake</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #f4f7f6; }
        .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1, h2 { color: #2c3e50; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin: 10px 0; cursor: pointer; }
        input[type="text"], input[type="email"] { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { background: #27ae60; color: white; border: none; padding: 15px; width: 100%; font-size: 1.1em; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        button:hover { background: #219150; }
    </style>
</head>
<body>
    <h1>Lainauslomake</h1>
    
    <div class="section">
        <div class="input-group"><input type="text" id="isantaNimi" placeholder="Isännän nimi"></div>
        <div class="input-group"><input type="email" id="isantaEmail" placeholder="Isännän sähköposti"></div>
        <div class="input-group"><input type="text" id="vierasNimi" placeholder="Vieraan nimi"></div>
        <div class="input-group"><input type="email" id="vierasEmail" placeholder="Vieraan sähköposti"></div>
    </div>

    <div class="section">
        <h2>Isännän tarkistuslista</h2>
        <label><input type="checkbox" class="isanta-check" value="Varusteet tarkistettu"> Varusteet tarkistettu</label>
        <label><input type="checkbox" class="isanta-check" value="Alus merikelpoinen"> Alus merikelpoinen</label>
        <label><input type="checkbox" class="isanta-check" value="Käyttöopastus annettu"> Käyttöopastus annettu</label>
    </div>

    <div class="section">
        <h2>Vieraan tarkistuslista</h2>
        <label><input type="checkbox" class="vieras-check" value="Uimataito vakuutettu"> Uimataito vakuutettu</label>
        <label><input type="checkbox" class="vieras-check" value="Pelastusliivit kunnossa"> Pelastusliivit kunnossa</label>
        <label><input type="checkbox" class="vieras-check" value="Sää tarkistettu"> Sää tarkistettu</label>
    </div>

    <button id="lahetaBtn">Lähetä ja tallenna</button>

    <script src="app.js"></script>
</body>
</html>
